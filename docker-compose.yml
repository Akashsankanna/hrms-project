version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: hrms-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hrmsdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: hrms-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: hrmsdb
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: hrms
      KEYCLOAK_CLIENT_ID: hrms-client
    depends_on:
      - postgres
      - keycloak

  frontend:
    build: ./frontend
    container_name: hrms-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: hrms-keycloak
    command: start-dev
    restart: always
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"

volumes:
  postgres_data: